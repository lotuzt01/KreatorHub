name: Deploy ke GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Instal dependensi
        run: npm install
      - name: Build produksi untuk GitHub Pages
        env:
          VITE_BASE_PATH: "./"
        run: npm run build
      - name: Siapkan fallback SPA & .nojekyll
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - name: Unggah artefak GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
